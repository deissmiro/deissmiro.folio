<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Miro Deiss</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<style>
@font-face { font-family: "Ubuntu Mono"; font-weight: 400; font-display: swap; src: url("/assets/fonts/UbuntuMono-Regular.ttf") format("truetype"); }
@font-face { font-family: "Ubuntu Mono"; font-weight: 700; font-display: swap; src: url("/assets/fonts/UbuntuMono-Bold.ttf") format("truetype"); }
:root { --bg: #fff; --ink: #0c0c0c; --ink-2: #6f6f72; --chip: #f3f3f2; --chip-hover: #e8e8e6; --stage: #f0f0ee; --ease: cubic-bezier(.2,.7,.2,1); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Ubuntu Mono", ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.bar { max-width: 1024px; margin: 0 auto; padding: 0 16px; height: 96px; display: flex; align-items: center; }
.me { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; line-height: 1.22; }
.me img { width: 40px; height: 40px; border-radius: 50%; background: var(--stage); object-fit: cover; }
main { min-height: calc(100vh - 96px); display: grid; place-items: center; padding: 24px 16px 96px; }
.nf { display: grid; justify-items: center; text-align: center; gap: 18px; }
.ava { position: relative; width: 168px; height: 168px; border-radius: 50%; background: var(--stage); display: grid; place-items: center; animation: float 4s ease-in-out infinite; }
.ava img { width: 150px; height: 150px; object-fit: contain; }
.tag { position: absolute; right: -18px; bottom: 18px; transform: rotate(-7deg); background: var(--ink); color: var(--bg); font-size: 18px; line-height: 1; padding: 6px 8px 5px; }
h1 { margin: 6px 0 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; }
p { margin: 0; max-width: 40ch; color: var(--ink-2); font-size: 17px; line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
.btn { display: inline-flex; align-items: center; padding: 10px 20px; border-radius: 999px; background: var(--chip); font-size: 16px; transition: background .25s, transform .25s var(--ease); }
.btn:hover { background: var(--chip-hover); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: #2a2a2a; }
.btn:active { transform: scale(.97); }
@keyframes float { 50% { transform: translateY(-6px) rotate(-2deg); } }
@media (prefers-reduced-motion: reduce) { .ava { animation: none; } }
</style>
</head>
<body>
<header class="bar"><a class="me" href="/" aria-label="Miro Deiss, home"><img src="/favicon-512.png" alt=""><span>Miro<br>Deiss</span></a></header>
<main>
  <section class="nf" aria-labelledby="t">
    <div class="ava"><img src="/favicon-512.png" alt="Miro Deiss avatar" width="150" height="150"><span class="tag">404</span></div>
    <h1 id="t">Page not found</h1>
    <p>This page doesn’t exist or has moved. Let’s get you back to something worth seeing.</p>
    <div class="actions"><a class="btn primary" href="/#work">See my work</a><a class="btn" href="/#about">About me</a></div>
  </section>
</main>
</body>
</html>
